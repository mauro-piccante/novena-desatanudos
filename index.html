so de la desobediencia de Eva se solucionó gracias a la obediencia de María. Lo que ató la virgen Eva a causa de su incredulidad, la Virgen María lo desató mediante su fe» (Adversus haereses, III, 22,4).","Treneo establece claramente un paralelismo perfecto entre las dos mujeres, tanto en la convergencia como la antítesis, igual que el apóstol había hecho con Adán y Cristo. Eva y María, estando las dos esposadas, eran todavía vírgenes. Pero mientras Eva desobedeció, causando la ruina y la muerte para sí y para el genero humano, María con su obediencia fue causa de salvación. La desobediencia de Eva impuso a la humanidad lazos de esclavitud espiritual, mientras que la obediencia de María desató esos lazos, llevando de nuevo al hombre a su primitiva libertad. La desobediencia de Eva es consecuencia de su incredulidad, en cambio la obediencia de María es fruto de su fe."]},{"titulo":"María, «abogada» de Eva","parrafos":["En otro pasaje, donde la antítesis Eva- María va en paralelo con la antítesis paulina Adán-Cristo, san Ireneo atribuye a la Virgen el apelativo de «abogada de Eva»: «Así como Eva fue seducida por la palabra del ángel (caído) hasta el punto de huir de Dios, habiendo transgredido su palabra, así María recibió el gozoso anuncio por medio de la palabra del ángel, de tal modo que, obedeciendo a su palabra, llevó a Dios dentro de sí. Y como aquella se dejó seducir hasta desobedecer a Dios, así esta se dejó persuadir para obedecer a Dios. Por esto, la Virgen María se convierte en abogada de la virgen Eva.","Como todo el género humano fue ligado a la muerte a causa de una virgen, igualmente fue liberado por medio de una Virgen, pues la desobediencia de una virgen fue compensada por la obediencia de la Virgen.","Si el pecado del primer hombre fue reparado por la recta conducta del Hijo primogénito (de Dios), si la astucia de la serpiente fue vencida por la simplicidad de la paloma (María), y si han sido rotos los lazos que nos tenían atados a la muerte, los herejes son tontos: ignoran la economía de Dios, ignoran su obra con el hombre» (Adversus haereses, V, 19,1).","Parece claro, según estos textos, que Ireneo no solo atribuye a María un papel dentro de la obra de la redención, sino que especifica que este papel está estrechamente unido a la acción realizada por el Salvador, nuevo Adán, de la misma manera que Eva tuvo una función, desgraciadamente negativa, junto al primer Adán.","La Virgen no se limita a llevar a cabo una función en un plano meramente personal, solo paralelo al de Eva. Hace algo más, porque con su simplicidad destruye el orgullo y la astucia de la serpiente, que es la autora de los males de Eva.","Pero Ireneo va más allá todavía. En una página de su Demostración de la doctrina apostólica escribe expresamente que, como Adán ha sido «recapitulado» en Cristo, de la misma manera Eva ha sido «recapitulada» en María. «Era conveniente y justo que Adán fuera recapitulado en Cristo, para que la muerte fuese absorbida por la inmortalidad, y que Eva fuera recapitulada en María, para que la Virgen, convertida en abogada de otra virgen, pudiese anular y destruir, con su obediencia virginal, la desobediencia virginal» (n. 33).","En los textos citados es fácil observar un cierto desarrollo progresivo. El principio de la recapitulación se integra con otro principio, el de la «recirculación», que introduce en la teología de Ireneo una nota histórico-salvífica. Si el primero afirma que la humanidad, caída a causa de su primera cabeza, Adán, debía ser reconducida a Dios por otro hombre que fuera su segunda cabeza, es decir Cristo, el principio de la recirculación afirma que este proceso de restauración llevado a cabo por el Salvador debía corresponder, paso a paso, en un plano antitético, a la historia de la caída. María entra así, en este proceso, como el anti- tipo de Eva. La Virgen por tanto intercede por los pecadores que, como Eva, no obedecen la Palabra de Dios.","El gran obispo de Lion atribuye a la Virgen el título de «abogada», que se hizo muy común posteriormente entre los cristianos. En los siglos siguientes la teología católica, para ilustrar la doctrina acerca de la colaboración y cooperación de María en la redención de los hombres y su mediación de la gracia divina, utilizó una expresión muy fuerte: corredención. Es de una gran actualidad y ciertamente será capaz de iluminar el debate actual sobre la colaboración de María en la redención de los hombres y su papel como mediadora.","En la Iglesia, estas enseñanzas no solo han sido retomadas y revalorizadas por la doctrina de la Lumen gentium, sino que han desempeñado una notable influencia incluso en el culto; de hecho, se han incluido en el Prefacio IV de Adviento: «La gracia que Eva nos arrebató nos ha sido devuelta en María»."]},{"titulo":"La novena","parrafos":["Con la novena a «María Desatanudos» llamamos humildemente a la puerta del cielo, pidiendo a la Virgen que interceda ante Dios por una intención particular. No se trata de una fórmula mágica, sino de una llamada insistente, hecha con fe y abandono, de una persona necesitada a Aquella que desata los nudos de nuestras vidas movida por su extraordinario poder de intercesión ante el Hijo, Jesús. «María se pone entre su Hijo y los hombres en la realidad de sus privaciones, indigencias y sufrimientos. Se pone “en medio”, o sea hace mediadora no como una persona extraña, sino en su papel de madre, consciente de que como tal puede — más bien “tiene el derecho de” — hacer presente al Hijo las necesidades de los hombres» (Juan Pablo Il, Redemptoris Mater, 21). Ella, por tanto, vive su presencia dentro del misterio de nuestra redención porque como Madre intercede ante el Hijo: coopera con su intercesión para que los nudos de nuestra vida se desaten, para que la tristeza de nuestra condición se transforme en la alegría de la salvación.","María, compartiendo nuestra condición humana, es capaz de compadecer toda debilidad. Aun no habiendo conocido el pecado, ella comprende al hombre pecador y lo ama con amor de Madre. «En las necesidades arrojaos a los brazos de María santísima, recurrid a ella como a una madre misericordiosa, y luego estad tranquilos, no os desaniméis, sino más bien confiad en ella» (San Pablo de la Cruz).","La oración mariana más antigua expresa profundamente esta convicción: «Bajo tu protección nos acogemos, santa Madre de Dios; no deseches las súplicas que te dirigimos en nuestras necesidades; antes bien, líbranos siempre de todo peligro».","¿Quién mejor que María, mujer, esposa, madre, viuda, con el corazón traspasado por una espada por la muerte de su Hijo, puede ayudarnos a desatar los nudos problemáticos, guiándonos hacia la vida nueva que nos dio el Resucitado?","Confiemos a esta tierna madre nuestras angustias, nuestros nudos y, desde ese momento, todo cambiará. Nuestra vida ordinaria se volverá fiesta, asombro, alegría sin fin."]},{"titulo":"Qué se entiende por «nudos»","parrafos":["Con la palabra «nudos» se entiende todos aquellos problemas presentes en nuestra vida, todos aquellos problemas que, con frecuencia, llevamos desde hace años y no sabemos cómo resolver; todos aquellos pecados que nos encadenan y nos impiden acoger a Dios en nuestra vida y echarnos en sus brazos como niños; todos aquellos rencores que hacen difícil amarnos humildemente y con sinceridad dentro de nuestras familias y que impiden que se cumpla el mandamiento de Jesús: «Amaos los unos a los otros, como yo os he amado» (cfr. Jn 13,34).","La lista podría continuar, porque son muchos los nudos que ahogan nuestra alma, que nos derriban, que nos quitan la alegría del corazón e incluso las ganas de vivir.","La Virgen María viene al encuentro de cada uno de nosotros para que le ofrezcamos todos estos nudos, que ella desatará uno tras otro. María es aquella que, con su amor maternal, cuida de los hermanos de su Hijo todavía peregrinos y en medio de peligros y afanes, hasta que sean conducidos a la patria celestial. «Todos - explicaba muchas veces el entonces cardenal Bergoglio - tenemos nudos en el corazón, carencias, y atravesamos dificultades. Nuestro buen Padre, que distribuye la gracia a todos sus hijos, quiere que nos fiemos de Ella, que le entreguemos los nudos de nuestros males, las madejas de nuestras miserias que nos impiden unirnos a Dios, para que Ella los desate y nos acerque a su hijo Jesús. Este es el significado de la imagen».","Confiemos, entonces, en la grandeza de nuestra Madre «que desata los nudos» y dejémonos llevar para que ella nos haga ver las maravillas que Dios ha preparado para nosotros."]},{"titulo":"Cuándo rezar la novena","parrafos":["Hoy a la Virgen la invocan de modo especial muchas parejas de esposos por problemas en la familia, por las dificultades de la vida matrimonial, por la incomprensión entre padres e hijos, por cuestiones de salud, por tensiones y problemas en el ámbito profesional, por la casa o los estudios, para curar la adicción al alcohol, la droga, los juegos de azar, la pornografía, las prácticas satánicas... Pero la novena es eficaz también para desatar todos aquellos nudos que nos impiden abrirnos al amor de Dios Padre y a los hermanos, todas aquellas dificultades, pequeñas y grandes, que la vida nos reserva cotidianamente.","El obispo auxiliar de Madrid y secretario general de la Conferencia Episcopal Española, Juan Antonio Martínez Camino, ha propuesto rezar a la Virgen Desatanudos por el papa Francisco, para que lo custodie y lo sostenga con su maternal solicitud en la misión que se le ha confiado.","Recordemos también que la santísima Virgen, como Puerta del cielo, es la que desata el último nudo, el de las almas del Purgatorio. Se puede rezar la novena en las fiestas de los días 15 de agosto, 28 de septiembre y 8 de diciembre."]},{"titulo":"Cómo se reza la novena","parrafos":["La primera y mejor disposición para que nuestra oración sea eficaz es vivir en estado de gracia o, no siendo así, al menos desear volver a tal estado lo más rápidamente posible mediante el sacramento de la Reconciliación.","Cada novena desata un solo nudo, por eso se debe rezar una novena a María Desatanudos por cada nudo que oprime nuestra vida.","La novena se puede rezar por otra persona solo si el nudo que padece esta persona afecta también a quien la reza. En otras palabras, se puede rezar la novena cuando el nudo de otra persona constituye un nudo en nuestra vida, nudo que pedimos que desate María.","La novena comienza con las oraciones inicia les. De especial importancia es el breve examen de conciencia con el que pedimos humildemente el perdón de nuestros pecados y formulamos el firme propósito de no cometerlos más. La novena comprende la oración del Rosario. A través de él María conducirá silenciosamente al fiel al descubrimiento de su identidad, mediante el itinerario de fe que ella mismo ha recorrido: asimilar nuestra vida a la de Jesús, reviviendo los misterios de nuestra salvación. No es casual que María se presentase en Fátima con el título especial de «Virgen del Rosario». El padre Pío de Pietrelcina, a quien le preguntaba por qué rezaba tantos Rosarios cada día, respondía: «Si la santa Virgen lo ha recomendado siempre vivamente allí donde se ha aparecido, ¿no te parece que debe ser por un motivo especial?». Lucía de Fátima aseguraba que, en este mundo tan agitado, «si todos rezaran el Rosario cada día, la Virgen obraría milagros». El papa Francisco nos recuerda también que «la oración con María, en especial el Rosario, tiene una dimensión “agonística”, es decir, de lucha, una oración que sostiene en la batalla contra el maligno y sus cómplices».","Después de rezar las tres primeras decenas del Rosario se pasa a la novena propia de cada día, en la que se suplica a la Virgen que desate específicamente el nudo por el que hacemos la novena.","Cada persona tiene un nudo que presentar a la Virgen para que lo desate. Es mejor empezar con el más simple, para que quede más claro cómo llegar al principal.","Meditemos cada palabra de la novena y, uno a uno, nuestros nudos se desatarán.","Se sigue luego con las dos últimas decenas del Rosario y las Letanías Lauretanas.","Se termina con las oraciones finales.","Para que esta novena sea eficaz y produzca los frutos esperados son necesarias la humildad, la confianza y la firme esperanza de ser escuchados, si de ello deriva la gloria de Dios y nuestro verdadero bien. Es necesaria también la perseverancia: no debemos cansarnos de rezar si Dios no nos escucha pronto, sino que debemos seguir rezando incluso con más fervor porque: «La oración audaz, humilde y fuerte, realiza milagros. La oración hace milagros, ¡pero debemos creer!» (Papa Francisco). Lo más importante es que seamos conscientes de que la Virgen María es nuestra consejera, nuestra abogada y nuestra mediadora en todo momento."]}],"intro_novena":{"titulo":"Introducción","parrafos":["La siguiente novena se reza durante nueve días consecutivos, con constancia y sin interrupción, cada vez que se quiere pedir a María que desate un nudo de nuestra vida."]},"sugerencias":["Como enseña la santa madre Iglesia, la vida espiritual, los ejercicios de piedad y las devociones están estrechamente ligados a la vida sacramental y son tanto más eficaces y fructíferos cuanto más se corresponde a la gracia del Señor. Por tanto, durante la novena es aconsejable acercarse al sacramento de la Reconciliación para pedir perdón a Dios por los propios pecados, participar en la santa Misa cotidiana (cuando esto sea posible) y recibir la sagrada Comunión, fuente y culmen de toda la vida cristiana.","Además, cada día de la novena es aconsejable:","Alabar, bendecir y dar gracias a la santísima Trinidad: a Dios Padre por el don de la creación; a Dios Hijo por el don de la redención; a Dios Espíritu Santo por el de la santificación.","Perdonar siempre y a todos. Vivir con empeño y constancia la oración personal, familiar y comunitaria. Realizar obras de caridad.","Abandonarse a la voluntad de Dios.","Siguiendo estas sugerencias y esforzándose cotidianamente en un camino de conversión, que lleve a cabo un cambio real de vida, se verán realizadas las maravillas que Dios ha reservado para cada uno de sus hijos, según sus tiempos y su voluntad.","La novena a María Desatanudos, de hecho, es muy eficaz, si se cree firmemente, para superar períodos de sufrimiento, de enfermedad, angustia, decadencia moral, problemas familiares, matrimonio en crisis, falta de trabajo; para ser iluminados a la hora de tomar las decisiones más difíciles, para ser curados, consolados y para pedir cualquier ayuda en las pequeñas y grandes necesidades de cada día; también como agradecimiento por las inmensas gracias que continuamente recibimos del Señor."],"esquema":["Oraciones iniciales Rosario: tres primeras decenas Novena del día correspondiente Rosario: dos últimas decenas Oraciones finales"]}</script>
